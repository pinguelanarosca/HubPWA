<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Outer Layer (Window / App Frame representation) -->
  <rect x="64" y="80" width="384" height="260" rx="36" fill="#1b202e" stroke="#2a3349" stroke-width="8" />

  <!-- Window Header with 3 dots -->
  <circle cx="108" cy="116" r="12" fill="#ef4444" />
  <circle cx="144" cy="116" r="12" fill="#f59e0b" />
  <circle cx="180" cy="116" r="12" fill="#10b981" />

  <!-- Center Chrome PWA Badge Layer -->
  <g filter="url(#glow)">
    <rect x="110" y="160" width="292" height="240" rx="44" fill="url(#emeraldGrad)" />
  </g>

  <!-- Inner PWA Text Symbol -->
  <text x="256" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" letter-spacing="-2">PWA</text>

  <!-- Bottom Fast-Access Indicator Lightning / Star -->
  <path d="M256 424 L244 448 L272 448 L252 476 L268 476 L240 496 L248 464 L228 464 Z" fill="#34d399" />
</svg>
